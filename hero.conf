# Que foto se usa de fondo en la portada.
#
#   angel   la del angel de cemetery, con la mascara hecha a mano. Es la que hay
#           ahora, y es la mejor: seis intentos de recorte, segun el README. Las
#           capas van commiteadas, asi que con esto no se toca nada.
#
#   auto    la del wallpaper que tengas puesto en el escritorio, deshecha en las
#           mismas tres capas por scripts/preparar-hero.py. Cambia el wallpaper y
#           la portada cambia con el, como la paleta de pywal.
#
# Con auto hay una diferencia con el angel que conviene saber: la mascara del
# angel esta hecha a mano y es un recorte de verdad. La automatica no puede
# segmentar una figura —solo hay PIL y numpy, sin cv2 ni torch ni un modelo de
# profundidad— asi que el sujeto se aproxima con una elipse suave en el centro y
# lo que se consigue es nitidez y desenfoque por distancia, no un recorte.
#
# Cambia la palabra de aqui y corre scripts/collect-system-stats.sh.
auto
