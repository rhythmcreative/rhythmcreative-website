<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- Que se permite y que no, y por que.
     --
     Esta pagina no carga NADA de fuera: ni un pixel, ni una fuente, ni un
     analytics, ni un script de un tercero. Todo lo que necesita esta aqui. Por
     eso se puede cerrar del todo, que es lo que hace esta linea.

     connect-src es lo que mas hace, y antes era 'none': la pagina no podia llamar a
     nadie. Aunque alguien dejara un error manana y lograra meter codigo en ella, no
     podria mandarse tus datos ni hablar con una pagina de anuncios.

     AHORA NO ES 'none'. El buscador de Algolia necesita salir, asi que se ha abierto
     solo a los dos dominios de Algolia y no a '*'. Sigue sin poder hablar con nadie mas,
     y el unico dato que sale es lo que escribe quien esta buscando, y solo si busca.
     Lo demas —lo que se descarga, de donde— sigue siendo cero y sigue siendo de aqui.

     El script de arriba es el unico script en linea, y va con su huella, que es
     una suma del texto exacto. Si alguien anade otro script en linea, el
     navegador no lo ejecuta: no coincide. Los scripts de siempre, los de
     assets/, siguen entrando con 'self'.

     style-src lleva 'unsafe-inline' porque un par de colores de pywal se ponen
     con style="..." en linea. Es lo unico que se abre, y con lo que se abre no
     se puede ejecutar codigo: un color solo pinta. Si algun dia se ponen con
     JavaScript, esa palabra se puede quitar.

     frame-ancestors no esta porque en un <meta> el navegador lo ignora: solo
     cuenta en una cabecera HTTP, que en GitHub Pages no se puede poner. Lo de
     que nadie meta esta pagina en un iframe tiene que ir en la cabecera. -->
<!--
  connect-src estaba en 'none', que hacia que esta pagina no pudiera llamar a nadie:
  ni a un servidor de analiticas ni a una fuente externa ni a un buscador. Con el
  buscador de Algolia se abre solo a los dos dominios de Algolia, y no a '*'.

  Se puede estrechar a un solo host en cuanto se sepa el Application ID:
    connect-src https://TU-ID-dsn.algolia.net;
  El comodin esta porque el prefijo del host es el Application ID, que va en el
  HTML, y asi el cambio no depende de que alguien se acuerde de tocar la CSP.

  Lo que sale por esa puerta no es la pagina, es lo que escribe quien busca, y solo
  si busca. assets/buscador.js lo tiene escrito en su cabecera, sin rodeos.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-s2TikfyJOBwbNHWOji/2LWxw3ZS0nmKyUR10ZwApEDY='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src https://*.algolia.net https://*.algolianet.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythmcrea</title>
<meta name="description" content="RHYTHMCREA. A Hyprland desktop and everything that came out around it.">
<!-- color-scheme "dark light" no dice cual de los dos se esta usando, solo que
     los dos valen. El que vale es la propiedad CSS de mas abajo: --suelo ya lo
     lleva el cambio de tema. Con esto el navegador pinta las barras de scroll y
     los controles nativos del color que toca, que antes se quedaban oscuros con
     la pagina en blanco. -->
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d0f">
<link rel="canonical" href="https://rhythmcrea.com/">

<!-- Para compartir el enlace. Sin esto, al mandar el enlace a Discord, Mastodon,
     Slack, Twitter o un correo no se ve NADA: ni titulo, ni texto, ni imagen.

     La URL tiene que ser ABSOLUTA. Una relativa no la resuelven.

     Estas cuatro estaban en el sitio de ejemplo del protocolo, y se dejaron asi a
     proposito hasta que se publico: mientras no hubiera dominio no habia que poner
     nada. Ya hay dominio, y por eso ya no hay ningun marcador de posicion en este
     fichero — si algum dia se busca esa cadena, tiene que dar cero resultados.

     La imagen la hace scripts/preparar-og.py con las capas de la portada, a
     1200x630, que es lo que piden los protocolos de compartir. No se descarga al
     abrir la pagina: los <meta> no son recursos, asi que no cuesta bytes. -->
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="RHYTHMCREA">
<meta property="og:title"       content="RHYTHMCREA">
<meta property="og:description" content="A Hyprland desktop that doesn't break, and everything that came out around it.">
<meta property="og:url"         content="https://rhythmcrea.com/">
<meta property="og:image"       content="https://rhythmcrea.com/assets/og.jpg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"   content="A winged statue in a foggy cemetery, with the name RHYTHMCREA across it.">
<meta property="og:locale"      content="en">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:title"       content="RHYTHMCREA">
<meta name="twitter:description" content="A Hyprland desktop that doesn't break, and everything that came out around it.">
<meta name="twitter:image"      content="https://rhythmcrea.com/assets/og.jpg">
<!-- El angel es el elemento mas grande y el primero que se ve, y esta solo
     en el CSS: el navegador no lo descubre hasta que ha parseado la hoja, que
     va detras. Con la precarga empieza a bajar en cuanto ve la cabecera. -->
  <!-- El tema, ANTES de la hoja de estilos y antes de pintar.

       El script que aplica el tema estaba al final del body, con el resto. Eso
       significa que el navegador pinta primero la pagina en oscuro y luego la
       cambia a claro: un destello blanco en cada recarga de quien tenga el tema
       claro guardado, que es justo lo que se nota al recargar.

       Aqui, en la cabecera y sin esperar a la hoja, se lee la misma clave y se
       pone la misma clase en el elemento html. Cuatro lineas, ningun script
       externo, y es lo unico que hace falta para que no haya ni un fotograma en
       el tema equivocado.

       Va antes del <link> de la hoja a proposito: si el navegador ya tiene el CSS
       en cache, ponerlo despues seria lo mismo, pero si no lo tiene, este bloque
       se ejecuta mientras la hoja se descarga y gana. La clave y la clase tienen
       que coincidir con las de app.js; si se cambia una, hay que cambiar las dos. -->

<script>
  try {
    /* El tema, aqui en la cabecera y antes de la hoja, para que este puesto
       antes del primer pintado. Si no, hay un fotograma en el contrario en cada
       recarga, que es justo lo que se nota al recargar con el tema claro
       guardado.

       La estructura es la del script de omarchy.org, y lo que importa es el ORDEN
       de los pasos:

         1. LEER lo guardado, con su propio try. Puede fallar —modo privado, un
            iframe sin permisos, algun file://— y no debe arrastrar al resto.
         2. VALIDAR contra los tres valores buenos. Uno raro no vale: si se
            acepta, el boton puede acabar marcando un modo que el <html> no tiene,
            con la pagina clara y el boton diciendo "automatico".
         3. DECIDIR el color con matchMedia, que NO necesita almacenamiento. Este
            es el paso que antes no podia llegar a ejecutarse: la lectura del
            storage estaba dentro del mismo try que el resto, asi que si fallaba
            se iba todo y la pagina se quedaba sin tema puesto. Con el storage
            bloqueado, la pagina salia con el oscuro del CSS y el boton con el
            icono de automatico: dos verdades distintas en la misma pantalla.
         4. GUARDAR lo resuelto, con su propio try, para que la proxima carga y
            app.js esten de acuerdo.
         5. En el catch de fuera, un valor por defecto y no un comentario vacio. */
    var modo = "auto";
    try { modo = localStorage.getItem("rhythm-crea-tema"); } catch (e) { /* sin storage */ }
    if (["auto", "claro", "negro"].indexOf(modo) < 0) modo = "auto";

    var claro = modo === "claro"
             || (modo === "auto" && !!(window.matchMedia &&
                 matchMedia("(prefers-color-scheme: light)").matches));
    if (claro) document.documentElement.classList.add("claro");
    /* El modo va tambien como atributo. El icono del boton depende de los tres
       modos y con la clase sola no hay forma de distinguir "automatico en oscuro"
       de "negro elegido a mano": se ven igual pero se portan distinto. */
    document.documentElement.setAttribute("data-tema", modo);
    try { localStorage.setItem("rhythm-crea-tema", modo); } catch (e) { /* sin storage */ }

    /* El preload del angel. Se CREA aqui en vez de poner un <link> fijo, porque
       hay dos imagenes, una por tema, y un solo preload solo puede poner una: con
       la fija se descargaba siempre la oscura y en tema claro eran 120 KB que no
       se pintan mientras la que si se pinta llegaba tarde. El aviso del navegador
       lo decia —"preloaded but not used"—, que es como se encontro.

       Y al crearlo desde aqui, que va antes de la hoja, adelanta el angel: empieza
       a bajar mientras se descarga el CSS, en vez de despues. */
    try {
      var a = document.createElement("link");
      a.rel = "preload"; a.as = "image"; a.fetchPriority = "high";
      a.href = claro ? "assets/angel-claro.webp" : "assets/angel-oscuro.webp";
      document.head.appendChild(a);
    } catch (e) { /* sin DOM: el angel se pedira con la hoja */ }
  } catch (e) {
    /* Si ha petado algo de lo de arriba —que no deberia, porque cada paso va
       protegido por su propio try— el <html> se queda sin tema y la pagina sale
       con el del CSS, que es el oscuro. Se pone uno por defecto para que la pagina
       y el boton no acaben diciendo cosas distintas. */
    document.documentElement.setAttribute("data-tema", "auto");
  }
</script>
  <!-- El angel NO se precarga aqui sino en el script del tema, mas arriba. Hay
       dos imagenes, una por tema, y un solo preload solo puede poner una: con la
       fija se descargaba siempre la oscura y en tema claro eran 120 KB que no se
       pintan mientras la que si se pinta llegaba tarde. El script crea el link
       del que toca, y de paso lo adelanta a antes de la hoja. -->
  <!-- El poster del clip, precargado. Son 23 KB y es lo primero que deberia
       verse en la seccion de hyprland, pero hasta que el navegador decide
       pedirlo —que es cuando pinta el <video>— el hueco sale vacio.
       Medido el 2026-10-04 con la red a 400 kbit: entre que aparece el
       reproductor y que se ve el cartel pasan casi dos segundos de rectangulo
       vacio. Con el preload, el cartel esta ahi desde el principio.
       Sin fetchpriority a proposito: la portada compite por el ancho de banda
       con el angel y con la hoja, y este no es el elemento mas importante de
       la pagina. Es el segundo. -->
  <link rel="preload" as="image" href="assets/hyprland-poster.webp">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/buscador.css">
<!-- El icono de la pestana. Es el halo de la cabeza del angel, que es el motivo
     que la pagina ya comparte con la barra: un anillo de oxido sobre el suelo
     oscuro. Antes era un punto suelto, que era un placeholder de los primeros
     dias y no significaba nada.

     Va en un data URI y no en un fichero aparte para no pedir una peticion mas:
     el icono se ve en la pestana antes de que la pagina haya descargado nada, y
     a 16 px un SVG se lee mejor que un PNG de 16. Probado a 16 y a 32 px con
     rsvg-convert. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0d0f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ba5f44' stroke-width='4.5'/%3E%3C/svg%3E">
</head>
<body>

<!-- Enlace de salto. Es lo primero que hay en el DOM y esta oculto hasta que le
     llega el foco por el teclado, que es justo cuando hace falta: saltar la barra
     y el angel entero para llegar al contenido. En un movil con barra fija encima
     del todo, el tabulador se para en cuatro cosas que no llevan a ninguna parte
     antes de llegar a nada util. -->
<a class="saltar" href="#contenido">Skip to content</a>

<!-- La barra. -->
<div class="barra-z">
  <!-- Tres zonas: el nombre a la izquierda y solo, el reloj en el medio, los
       enlaces a la derecha. El reloj va en una columna propia del grid para que
       quede centrado de verdad, y no "mas o menos" centrado segun lo que
       mida cada lado. -->
  <div class="isla" tabindex="0" aria-label="Navigation">
    <div class="izq">
      <span class="rotulo">Rhythmcrea</span>
    </div>
    <span class="reloj" id="reloj">--:--:--</span>
    <!-- La zona derecha: los enlaces y el interruptor. Van en un div porque el
         grid de la barra es de tres columnas (1fr auto 1fr) y el reloj tiene que
         seguir cayendo en la del medio. Con el boton como cuarto hijo suelto, el
         reloj se desplazaba de sitio.

         Y el boto va FUERA del nav a proposito: dentro, el display:none que el nav
         recibe por debajo de 620 px se lo llevaba por delante, y en un movil no
         habia forma de cambiar de tema. -->
    <div class="der">
      <nav>
        <a href="#hyprland">hyprland</a>
        <a href="#instalar">install</a>
      </nav>
      <button class="interruptor" id="interruptor" type="button"
              aria-pressed="false" title="Switch to the light theme">
        <!-- Iconos del mismo set, para que pesen lo mismo. El de la luna que
             habia antes no estaba centrado en su caja de 24x24: la dibujaba
             descentrada, y con el contenedor centrado se notaba el medio pixel
             de desvio. -->
        <!-- El icono del modo automatico: un circulo con medio relleno, el signo
             clasico de "contraste". Es el mismo trazo que los otros dos —1.7 de
             grosor, sin relleno, extremos redondos— para que los tres pesen lo
             mismo al girar. Va el primero porque es el estado por defecto. -->
        <svg class="ic ic-auto" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.4"/>
          <path d="M12 3.6a8.4 8.4 0 0 1 0 16.8Z" fill="currentColor" stroke="none"/>
        </svg>
        <svg class="ic ic-luna" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg class="ic ic-sol" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                   M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span class="sr">Switch theme</span>
      </button>
    </div>
  </div>
</div>

<main id="contenido">

<!-- El campo: la foto deshecha en capas que se mueven a distinta velocidad. -->
<section class="campo" id="campo">
  <div class="escena" id="escena">
    <div class="respaldo" aria-hidden="true"></div>
    <!-- Las cuatro capas dentro de una caja. La caja es JUSTO el rectangulo de
         la foto, y su mascara se lleva los doce pixeles de arriba y de abajo, con
         lo que la foto no corta en seco contra el respaldo, que esta
         desenfocado y va mas claro. -->
    <div class="capas" id="capas">
      <div class="capa fondo"    data-hondo="0.6"></div>
      <div class="capa angel"    data-hondo="1.5"></div>
      <!-- El aro, en su propia imagen y solo con la parte del anillo: es lo que
           se enciende al pinchar. Va con data-hondo 1.5, el mismo que el angel,
           para que se mueva pegado a la cabeza y no se quede mientras las capas
           de al lado se separan. Lo hace scripts/preparar-angel.py. -->
      <div class="capa aro"      data-hondo="1.5"></div>
      <div class="capa velo"     data-hondo="3.4"></div>
      <div class="capa frente"   data-hondo="5.2"></div>
    </div>
    <div class="halo" id="halo" aria-hidden="true"></div>
    <div class="luz"   id="luz"  aria-hidden="true"></div>
    <canvas class="motas" id="motas" aria-hidden="true"></canvas>
  </div>

  <div class="cartel">
    <!-- El cursor va DENTRO del h1 y no al lado. Es lo que hace omarchy.org con su
         wordmark, y no es un detalle: un cursor pegado al final del texto es la
         señal de que la pagina se esta "escribiendo", y si va fuera del titular se
         lee como un adorno suelto. aria-hidden porque no aporta nada a quien no lo
         ve: el nombre ya esta entero en el h1 para el lector de pantalla.
         Con prefers-reduced-motion el CSS lo quita entero (display: none), y con
         el reduced-motion del sistema el cursor es justo lo primero que sobra. -->
    <h1 class="nombre">RHYTHMCREA<span class="cursor" aria-hidden="true"></span></h1>
    <p class="bajo">a page for rhythmcrea&#8217;s repositories</p>
    <button class="bajar" id="bajar" type="button">repositories <i></i></button>
  </div>
</section>

<!-- Hyprland. Lo unico que hay, con su seccion entera. -->
<section class="cola seccion" id="hyprland">
  <div id="hyprland-caja"></div>
</section>

</main>

<!-- El pie es el menu. En la barra solo caben cuatro cosas, y en un movil
     caben dos: sin esto, en el movil no habia ninguna manera de llegar a
     ningun sitio. Aqui esta todo, siempre. -->
<footer class="cola pie-menu" id="fuera">
  <div class="marca-menu">
    <a class="rotulo-menu" href="#campo">Rhythmcrea</a>
    <p>An Arch desktop that doesn&#8217;t break.</p>

  </div>

  <!-- Esta pagina. Solo lo que hay dentro: hyprland, que es donde esta el
       reproductor y los botones, y Install, que es la unica salida de la
       pagina hacia fuera. Se quito el enlace "top", que estaba de mas: el logo de
       arriba ya hace eso, y volver al principio desde el final es pulsar Inicio. -->
  <nav class="col-menu" aria-label="This page">
    <h3>THIS PAGE</h3>
    <a href="#hyprland">hyprland</a>
    <a href="https://github.com/rhythmcreative/hyprland" target="_blank" rel="noopener">Install</a>
  </nav>



    <!-- La linea de abajo: el copyright a la izquierda y de donde sale la pagina a
         la derecha. Los dos lados van en el mismo <div> y el space-between del flex
         los separa, asi que no hacen falta clases ni columnas para ponerlos a su
         sitio.

         Lo de "On GitHub Pages, from rhythmcreative/rhythmcreative-website" es de
         donde sale de verdad: el sitio es estatico, lo compila GitHub Pages, y el
         repo esta abierto. Va aqui y no en la columna de la marca porque es de
         donde viene, no del autor.

         El repo se llama `rhythmcreative-website` y no `rhythm-site`. Lo segundo es
         el nombre de la carpeta de este ordenador, que no tiene nada que ver: el
         enlace va al repo de verdad, y por eso el texto va con el nombre entero y
         no con una abreviatura.

         El bloque de creditos de antes, "Static files, no build, no framework.
         Served by GitHub Pages.", no vuelve: decia casi lo mismo dos veces, y esta
         linea ya lo dice. -->
    <div class="pie-fin">
      <span class="pie-fin-izq">&copy; 2026 Rhythmcrea</span>
      <span class="pie-fin-der"><span id="idiomas" class="idiomas"></span> <span class="idiomas-sep">·</span> On GitHub Pages, from <a href="https://github.com/rhythmcreative/rhythmcreative-website" target="_blank" rel="noopener">rhythmcreative/rhythmcreative-website</a></span>
    </div>
</footer>

<script src="data/github.js"></script>
<script src="assets/hyprland.js"></script>
<script src="assets/capa-datos.js"></script>
<script src="assets/capa.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script src="data/buscador-local.js"></script>
<script src="assets/buscador.js"></script>
</body>
</html>
