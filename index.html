<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythmcrea</title>
<meta name="description" content="RHYTHMCREA. A Hyprland desktop and everything that came out around it.">
<!-- color-scheme "dark light" no dice cual de los dos se esta usando, solo que
     los dos valen. El que vale es la propiedad CSS de mas abajo: --suelo ya lo
     lleva el cambio de tema. Con esto el navegador pinta las barras de scroll y
     los controles nativos del color que toca, que antes se quedaban oscuros con
     la pagina en blanco. -->
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d0f">
<link rel="canonical" href="https://TU-DOMINIO/">

<!-- Para compartir el enlace. Sin esto, al mandar el enlace a Discord, Mastodon,
     Slack, Twitter o un correo no se ve NADA: ni titulo, ni texto, ni imagen.

     La URL tiene que ser ABSOLUTA. Una relativa no la resuelven, y aqui no hay
     ningunayet porque el sitio no esta publicado todavia: hay que cambiar
     TU-DOMINIO por el de verdad, una vez, al publicar. Esta en el README.

     La imagen la hace scripts/preparar-og.py con las capas de la portada, a
     1200x630, que es lo que piden los protocolos de compartir. No se descarga al
     abrir la pagina: los <meta> no son recursos, asi que no cuesta bytes. -->
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="RHYTHMCREA">
<meta property="og:title"       content="RHYTHMCREA">
<meta property="og:description" content="A Hyprland desktop that doesn't break, and everything that came out around it.">
<meta property="og:url"         content="https://TU-DOMINIO/">
<meta property="og:image"       content="https://TU-DOMINIO/assets/og.jpg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"   content="A winged statue in a foggy cemetery, with the name RHYTHMCREA across it.">
<meta property="og:locale"      content="en">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:title"       content="RHYTHMCREA">
<meta name="twitter:description" content="A Hyprland desktop that doesn't break, and everything that came out around it.">
<meta name="twitter:image"      content="https://TU-DOMINIO/assets/og.jpg">
<!-- El angel es el elemento mas grande y el primero que se ve, y esta solo
     en el CSS: el navegador no lo descubre hasta que ha parseado la hoja, que
     va detras. Con la precarga empieza a bajar en cuanto ve la cabecera. -->
  <!-- El tema, ANTES de la hoja de estilos y antes de pintar.

       El script que aplica el tema estaba al final del body, con el resto. Eso
       significa que el navegador pinta primero la pagina en oscuro y luego la
       cambia a claro: un destello blanco en cada recarga de quien tenga el tema
       claro guardado, que es justo lo que se nota al recargar.

       Aqui, en la cabecera y sin esperar a la hoja, se lee la misma clave y se
       pone la misma clase en el elemento html. Cuatro lineas, ningun script
       externo, y es lo unico que hace falta para que no haya ni un fotograma en
       el tema equivocado.

       Va antes del <link> de la hoja a proposito: si el navegador ya tiene el CSS
       en cache, ponerlo despues seria lo mismo, pero si no lo tiene, este bloque
       se ejecuta mientras la hoja se descarga y gana. La clave y la clase tienen
       que coincidir con las de app.js; si se cambia una, hay que cambiar las dos. -->

<script>
  try {
    if (localStorage.getItem("rhythm-crea-tema") === "claro") {
      document.documentElement.classList.add("claro");
    }
  } catch (e) { /* sin storage: se queda en oscuro, que es el tema por defecto */ }
</script>
<link rel="preload" as="image" href="assets/angel-oscuro.webp" fetchpriority="high">
<link rel="stylesheet" href="assets/style.css">
<!-- El icono de la pestana. Es el halo de la cabeza del angel, que es el motivo
     que la pagina ya comparte con la barra: un anillo de oxido sobre el suelo
     oscuro. Antes era un punto suelto, que era un placeholder de los primeros
     dias y no significaba nada.

     Va en un data URI y no en un fichero aparte para no pedir una peticion mas:
     el icono se ve en la pestana antes de que la pagina haya descargado nada, y
     a 16 px un SVG se lee mejor que un PNG de 16. Probado a 16 y a 32 px con
     rsvg-convert. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0d0f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ba5f44' stroke-width='4.5'/%3E%3C/svg%3E">
</head>
<body>

<!-- Enlace de salto. Es lo primero que hay en el DOM y esta oculto hasta que le
     llega el foco por el teclado, que es justo cuando hace falta: saltar la barra
     y el angel entero para llegar al contenido. En un movil con barra fija encima
     del todo, el tabulador se para en cuatro cosas que no llevan a ninguna parte
     antes de llegar a nada util. -->
<a class="saltar" href="#contenido">Skip to content</a>

<!-- La barra. -->
<div class="barra-z">
  <!-- Tres zonas: el nombre a la izquierda y solo, el reloj en el medio, los
       enlaces a la derecha. El reloj va en una columna propia del grid para que
       quede centrado de verdad, y no "mas o menos" centrado segun lo que
       mida cada lado. -->
  <div class="isla" tabindex="0" aria-label="Navigation">
    <div class="izq">
      <span class="rotulo">Rhythmcrea</span>
    </div>
    <span class="reloj" id="reloj">--:--:--</span>
    <!-- La zona derecha: los enlaces y el interruptor. Van en un div porque el
         grid de la barra es de tres columnas (1fr auto 1fr) y el reloj tiene que
         seguir cayendo en la del medio. Con el boton como cuarto hijo suelto, el
         reloj se desplazaba de sitio.

         Y el boto va FUERA del nav a proposito: dentro, el display:none que el nav
         recibe por debajo de 620 px se lo llevaba por delante, y en un movil no
         habia forma de cambiar de tema. -->
    <div class="der">
      <nav>
        <a href="#hyprland">hyprland</a>
        <a href="#instalar">install</a>
      </nav>
      <button class="interruptor" id="interruptor" type="button"
              aria-pressed="false" title="Switch to the light theme">
        <!-- Iconos del mismo set, para que pesen lo mismo. El de la luna que
             habia antes no estaba centrado en su caja de 24x24: la dibujaba
             descentrada, y con el contenedor centrado se notaba el medio pixel
             de desvio. -->
        <svg class="ic ic-luna" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg class="ic ic-sol" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                   M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span class="sr">Switch theme</span>
      </button>
    </div>
  </div>
</div>

<main id="contenido">

<!-- El campo: la foto deshecha en capas que se mueven a distinta velocidad. -->
<section class="campo" id="campo">
  <div class="escena" id="escena">
    <div class="respaldo" aria-hidden="true"></div>
    <!-- Las cuatro capas dentro de una caja. La caja es JUSTO el rectangulo de
         la foto, y su mascara se lleva los doce pixeles de arriba y de abajo, con
         lo que la foto no corta en seco contra el respaldo, que esta
         desenfocado y va mas claro. -->
    <div class="capas" id="capas">
      <div class="capa fondo"    data-hondo="0.6"></div>
      <div class="capa angel"    data-hondo="1.5"></div>
      <!-- El aro, en su propia imagen y solo con la parte del anillo: es lo que
           se enciende al pinchar. Va con data-hondo 1.5, el mismo que el angel,
           para que se mueva pegado a la cabeza y no se quede mientras las capas
           de al lado se separan. Lo hace scripts/preparar-angel.py. -->
      <div class="capa aro"      data-hondo="1.5"></div>
      <div class="capa velo"     data-hondo="3.4"></div>
      <div class="capa frente"   data-hondo="5.2"></div>
    </div>
    <div class="halo" id="halo" aria-hidden="true"></div>
    <div class="luz"   id="luz"  aria-hidden="true"></div>
    <canvas class="motas" id="motas" aria-hidden="true"></canvas>
  </div>

  <div class="cartel">
    <!-- El cursor va DENTRO del h1 y no al lado. Es lo que hace omarchy.org con su
         wordmark, y no es un detalle: un cursor pegado al final del texto es la
         señal de que la pagina se esta "escribiendo", y si va fuera del titular se
         lee como un adorno suelto. aria-hidden porque no aporta nada a quien no lo
         ve: el nombre ya esta entero en el h1 para el lector de pantalla.
         Con prefers-reduced-motion el CSS lo quita entero (display: none), y con
         el reduced-motion del sistema el cursor es justo lo primero que sobra. -->
    <h1 class="nombre">RHYTHMCREA<span class="cursor" aria-hidden="true"></span></h1>
    <p class="bajo">a page for rhythmcrea&#8217;s repositories</p>
    <button class="bajar" id="bajar" type="button">repositories <i></i></button>
  </div>
</section>

<!-- Hyprland. Lo unico que hay, con su seccion entera. -->
<section class="cola seccion" id="hyprland">
  <div id="hyprland-caja"></div>
</section>

</main>

<!-- El pie es el menu. En la barra solo caben cuatro cosas, y en un movil
     caben dos: sin esto, en el movil no habia ninguna manera de llegar a
     ningun sitio. Aqui esta todo, siempre. -->
<footer class="cola pie-menu" id="fuera">
  <div class="marca-menu">
    <a class="rotulo-menu" href="#campo">Rhythmcrea</a>
    <p>An Arch desktop that doesn&#8217;t break.</p>

  </div>

  <!-- Esta pagina. Solo lo que hay dentro: hyprland, que es donde esta el
       reproductor y los botones, y Install, que es la unica salida de la
       pagina hacia fuera. Se quito el enlace "top", que estaba de mas: el logo de
       arriba ya hace eso, y volver al principio desde el final es pulsar Inicio. -->
  <nav class="col-menu" aria-label="This page">
    <h3>THIS PAGE</h3>
    <a href="#hyprland">hyprland</a>
    <a href="https://github.com/rhythmcreative/hyprland" target="_blank" rel="noopener">Install</a>
  </nav>



    <!-- La linea de abajo: el copyright a la izquierda y de donde sale la pagina a
         la derecha. Los dos lados van en el mismo <div> y el space-between del flex
         los separa, asi que no hacen falta clases ni columnas para ponerlos a su
         sitio.

         Lo de "On GitHub Pages, from rhythmcreative/rhythm-site" es de donde sale de
         verdad: el sitio es estatico, lo compila GitHub Pages, y el repo esta
         abierto. Va aqui y no en la columna de la marca porque es de donde viene,
         no del autor.

         El bloque de creditos de antes, "Static files, no build, no framework.
         Served by GitHub Pages.", no vuelve: decia casi lo mismo dos veces, y esta
         linea ya lo dice. -->
    <div class="pie-fin">
      <span class="pie-fin-izq">&copy; 2026 Rhythmcrea</span>
      <span class="pie-fin-der">On GitHub Pages, from <a href="https://github.com/rhythmcreative/rhythm-site" target="_blank" rel="noopener">rhythmcreative/rhythm-site</a></span>
    </div>
</footer>

<script src="data/system.js"></script>
<script src="data/github.js"></script>
<script src="assets/hyprland.js"></script>
<script src="assets/capa-datos.js"></script>
<script src="assets/capa.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
