<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythm</title>
<meta name="description" content="Un escritorio Hyprland y lo que ha salido alrededor.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d0f">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230b0d0f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ba5f44'/%3E%3C/svg%3E">
</head>
<body>

<canvas id="lluvia" aria-hidden="true"></canvas>

<!-- La barra. La unica pieza que ya estaba bien, y no se toca. -->
<div class="barra-z capa-z">
  <div class="isla">
    <span class="ojo-mini" id="ojo-mini" title="temperatura de la cpu" aria-hidden="true"></span>
    <span class="rotulo">Rhythm</span>
    <nav>
      <a href="#proyectos">proyectos</a>
      <a href="#fuera">fuera</a>
    </nav>
    <span class="reloj" id="reloj">--:--:--</span>
  </div>
</div>

<!-- El campo: lluvia y un ojo. No hay nada mas arriba. -->
<section class="campo capa-z" id="campo">
  <canvas id="ojo" aria-label="Un ojo que te sigue. Pinchalo." role="img"></canvas>
  <p class="susurro" id="susurro">&nbsp;</p>
  <p class="firma">rhythm · hyprland · arch · <span id="cuenta">19</span> repos</p>
  <a class="bajar" href="#proyectos" aria-label="Ir a los proyectos">proyectos<i></i></a>
</section>

<!-- Los repos: capsulas, no tarjetas. Pincha una y se abre ahi mismo. -->
<section class="capa-z" id="proyectos">
  <div class="rejilla" id="rejilla-p"></div>
</section>

<footer class="capa-z" id="fuera">
  <div class="pie">
    <a href="https://github.com/rhythmcreative" target="_blank" rel="noopener">github</a>
    <a href="https://github.com/rhythmcreative/hyprland" target="_blank" rel="noopener">hyprland</a>
    <a href="https://github.com/rhythmcreative/rust-dock" target="_blank" rel="noopener">rust-dock</a>
    <span class="der" id="sello">&nbsp;</span>
  </div>
</footer>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<script src="data/system.js"></script>
<script src="data/github.js"></script>
<script src="assets/projects.js"></script>
<script src="assets/ojo.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
