<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RHYTHMCREA</title>
<meta name="description" content="RHYTHMCREA. Un escritorio Hyprland y lo que ha salido alrededor.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d0f">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230b0d0f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ba5f44'/%3E%3C/svg%3E">
</head>
<body>

<!-- La barra. -->
<div class="barra-z">
  <!-- Tres zonas: el nombre a la izquierda y solo, el reloj en el medio, los
       enlaces a la derecha. El reloj va en una columna propia del grid para que
       quede centrado de verdad, y no "mas o menos" centrado depending de lo que
       mida cada lado. -->
  <div class="isla" tabindex="0" aria-label="Navegacion">
    <div class="izq">
      <span class="punto" id="punto" title="temperatura de la cpu" aria-hidden="true"></span>
      <span class="rotulo">Rhythmcrea</span>
    </div>
    <span class="reloj" id="reloj">--:--:--</span>
    <nav>
      <a href="#hyprland">hyprland</a>
      <a href="#fuera">fuera</a>
    </nav>
  </div>
</div>

<!-- El campo: la foto deshecha en capas que se mueven a distinta velocidad. -->
<section class="campo" id="campo">
  <div class="escena" id="escena">
    <div class="respaldo" aria-hidden="true"></div>
    <div class="capa fondo"    data-hondo="0.6"></div>
    <div class="capa angel"    data-hondo="1.5"></div>
    <div class="capa velo"     data-hondo="3.4"></div>
    <div class="capa frente"   data-hondo="5.2"></div>
    <div class="halo" id="halo" aria-hidden="true"></div>
    <div class="luz"   id="luz"  aria-hidden="true"></div>
    <canvas class="motas" id="motas" aria-hidden="true"></canvas>
    <div class="brillo" id="brillo" aria-hidden="true"></div>
  </div>

  <div class="cartel">
    <h1 class="nombre">RHYTHMCREA</h1>
    <p class="bajo">hyprland · arch · quickshell · rust</p>
    <button class="bajar" id="bajar" type="button">hyprland <i></i></button>
  </div>
</section>

<!-- Hyprland. Lo unico que hay, con su seccion entera. -->
<section class="cola seccion" id="hyprland">
  <div id="hyprland-caja"></div>
</section>

<footer class="cola" id="fuera">
  <div class="pie">
    <a href="https://github.com/rhythmcreative" target="_blank" rel="noopener">github</a>
    <a href="https://github.com/rhythmcreative/rust-dock" target="_blank" rel="noopener">rust-dock</a>
    <span class="der" id="sello">&nbsp;</span>
  </div>
</footer>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<script src="data/system.js"></script>
<script src="data/github.js"></script>
<script src="assets/hyprland.js"></script>
<script src="assets/capa-datos.js"></script>
<script src="assets/capa.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
